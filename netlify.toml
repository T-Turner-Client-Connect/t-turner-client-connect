# Netlify configuration for TTurner Client Connect.
#
# Next.js App Router app with Server Actions, authenticated API routes and a
# proxy (src/proxy.ts). It must be served by the Next.js Runtime for Netlify
# (@netlify/plugin-nextjs) — do NOT add an SPA-style "/* /index.html 200"
# redirect; it would break server-rendered and authenticated routes.

[build]
  # Database migrations (including the baseline default groups) live in
  # netlify/database/migrations and are applied by Netlify Database
  # automatically before each deploy is published, so the build itself never
  # needs a database connection.
  command = "npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
