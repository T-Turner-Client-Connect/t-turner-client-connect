# Netlify configuration for TTurner Client Connect.
#
# Next.js App Router app with Server Actions, authenticated API routes and a
# proxy (src/proxy.ts). It must be served by the Next.js Runtime for Netlify
# (@netlify/plugin-nextjs) — do NOT add an SPA-style "/* /index.html 200"
# redirect; it would break server-rendered and authenticated routes.

[build]
  # The build never touches the database. Netlify applies the SQL migrations in
  # netlify/database/migrations (schema + baseline groups) to the attached
  # Netlify Database right before each deploy is published. When the Prisma
  # schema changes, copy the new prisma/migrations/<name>/migration.sql there.
  command = "npx prisma generate && npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
