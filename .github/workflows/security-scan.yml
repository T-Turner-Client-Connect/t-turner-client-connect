# Vulnerability scanning for TTurner Client Connect.
# - Dependency audit: fails when a production dependency has a known high or
#   critical vulnerability (npm audit against the GitHub Advisory Database).
# - CodeQL: static analysis of the application code for security flaws.
# Runs on every pull request, on every change to main, and weekly.
# Results are recorded in the Actions tab and the repository's Security tab.
name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 12 * * 1" # Mondays 12:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL code scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
